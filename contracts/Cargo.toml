[workspace]
resolver = "2"
members = [
    "wq-token",
    "quest-manager",
]

[workspace.dependencies]
soroban-sdk = "27"

# Release profile tuned for small, cheap Wasm (recommended by Stellar docs).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
